name: Temporary VPS

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl \
            wget \
            git \
            unzip \
            zip \
            jq \
            htop \
            nano \
            vim \
            tmux \
            ca-certificates \
            openssh-client

      - name: Start tmate
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 350
        with:
          detached: false
          connect-timeout-seconds: 600
