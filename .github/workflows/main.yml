name: Temporary SSH Runner

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Start SSH session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Keep runner alive
        run: |
          echo "SSH runner aktif."
          echo "Session akan tetap hidup selama job berjalan."
          sleep 1800
