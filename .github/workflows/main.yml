name: Temporary VPS via tmate

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update system
        shell: bash
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get upgrade -y

      - name: Install common tools
        shell: bash
        run: |
          set -e
          sudo apt-get install -y \
            curl \
            wget \
            git \
            unzip \
            zip \
            jq \
            htop \
            neofetch \
            nano \
            vim \
            tmux \
            ca-certificates

      - name: Start tmate SSH session
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 350
        with:
          limit-access-to-actor: true
